# Copy to config.yaml. Relative paths resolve against this file's folder.
db: jobpoller.sqlite3
output: discovered.md          # point at your project's queue/ folder if you like
request_delay_seconds: 0.5     # pause between boards; be polite
cache_days: 14                 # keep every fetched job this long so criteria can be re-tuned offline

# Your hand-edited application queue (markdown). `jobpoller promote <id>` appends rows to its
# `| # | Role | Company | Apply link | Resume | Cover letter | Status |` table (creating a
# "Discovered by jobpoller" section if there is none) and never touches rows you wrote.
queue_path: queue/job_queue.md
log: jobpoller.log            # run log (rotated, capped at ~9 MB total)
log_days: 30                   # delete rotated logs older than this
digest: digest.html            # where `jobpoller digest` writes the static HTML page
schedule_time: "08:00"         # daily run time for `jobpoller schedule install` (quote it)

# After a real `run`: one notification if any NEW job has an LLM fit >= threshold.
# Failures here only print a warning. Needs llm.enabled (keyword-only jobs have no fit).
notify:
  threshold: 80
  desktop: true                # notify-send
  ntfy: ""                     # optional topic URL, e.g. https://ntfy.sh/<your-private-topic>.
                               # Note: that sends the top job's title to that server.

# Company board slugs = the last path segment of the careers URL:
#   boards.greenhouse.io/<slug>   jobs.lever.co/<slug>   jobs.ashbyhq.com/<slug>
# These slugs all responded when last checked (Nov 2026) but companies move boards, so run
# `jobpoller check` to see which still do, then swap in companies you actually want.
boards:
  greenhouse: [natera, cloudflare, gitlab, datadog, mongodb, elastic, grafanalabs, samsara, sofi]
  lever: [zoox, palantir]
  ashby: [ramp, supabase, posthog, linear]

hn: true   # newest "Ask HN: Who is hiring?" thread

# Optional: rank keyword matches against your resume with a local Ollama model.
# With this on, a job is queued only after it has been ranked and scored >= min_fit.
llm:
  enabled: false                       # flip to true once you have pulled the profile's model
  # Hardware preset. Anything you set below overrides it.
  #   light    qwen3:4b   no discrete GPU / integrated graphics, ~16 GB RAM or less
  #   balanced qwen3:8b   no discrete GPU but patient, or a GPU with 8 GB
  #   heavy    qwen3:14b  discrete GPU with 12+ GB VRAM (the default)
  # Ollama normally runs light/balanced on the CPU. Changing model re-ranks everything.
  profile: heavy
  base_url: http://localhost:11434
  # model: qwen3:14b                   # uncomment any of these four to override the profile
  # num_ctx: 8192                      # prompt window; resume + posting must fit
  # max_new_rankings: 40               # cap on uncached LLM calls per run; the rest wait
  # timeout_seconds: 180               # first call includes model load time
  resume: resume.md                    # your master resume as .md/.txt (not .docx)
  preferences: >-
    Backend and systems engineering. Language priority: Python, Java, C#, Rust, C/C++.
    San Diego or remote. Entry-to-mid level; strongly dislikes PHP-only and front-end-only roles.
  min_fit: 50                          # 80+ strong, 60-79 good, 40-59 stretch

criteria:
  include_title: [software, backend, back-end, full stack, full-stack, systems, platform,
                  infrastructure, swe, developer]
  exclude_title: [staff, principal, director, vp, manager, intern, internship, sales, mechanical,
                  hardware, recruiter, designer, support, marketing]
  locations: [san diego, california, remote]   # substrings, case-insensitive
  accept_remote: true
  exclude_locations: [emea, europe, india, united kingdom, london, germany, canada, brazil]
  # Hard-reject phrases in the posting text. Uncomment what applies to you:
  exclude_text: []
  #  - ts/sci
  #  - active security clearance
  #  - us citizenship required
  max_age_days: 45
  min_score: 12
  # Weight per keyword, counted once in the description and once more if it is in the title.
  keywords:
    python: 8
    java: 8
    "c#": 5
    rust: 6
    "c++": 3
    fastapi: 4
    postgresql: 4
    postgres: 4
    clickhouse: 3
    sql: 2
    docker: 2
    backend: 5
    back-end: 5
    distributed systems: 4
    operating systems: 3
    database: 3
    linux: 2
    php: -4
    salesforce: -5
