[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpoller"
version = "0.2.0"
description = "Poll public ATS job boards and HN, filter, score, optionally rank with a local LLM, append to a markdown queue."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]  # `jobpoller mcp` (Claude Desktop and other MCP clients)
dev = ["pytest", "mypy", "ruff", "types-PyYAML", "mcp>=2,<3"]

[project.scripts]
jobpoller = "jobpoller.cli:main"

[tool.setuptools]
packages = ["jobpoller"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"jobpoller/digest.py" = ["E501"]  # embedded CSS/JS string constants

[tool.mypy]
strict = true
